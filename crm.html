<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM FloreSer — Clínica Corpo e Alma</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1E3A3A">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin
    src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #F5F3EE
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    /* ==========================================================
       COLE AQUI A URL DO SEU APPS SCRIPT (termina com /exec)
       ========================================================== */
    var URL_API = "https://script.google.com/macros/s/AKfycbzy9WCfP4l08dn2h2K34uEL6e0mqFBjVMugcHiTc0oUGmpS7gOJjbxs58CB87AoFUw-/exec";

    var SESSAO = { senha: "", rev: 0 };

    async function chamarAPI(dados) {
      var resposta = await fetch(URL_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(dados),
        redirect: "follow",
      });
      return await resposta.json();
    }

    /* Adaptador: o app continua usando window.storage,
       mas por baixo tudo vai para a planilha do Google. */
    window.storage = {
      async get(chave) {
        var r = await chamarAPI({ acao: "ler", senha: SESSAO.senha });
        if (!r.ok) throw new Error(r.erro || "falha ao ler");
        SESSAO.rev = r.rev;
        return { key: chave, value: JSON.stringify(r.dados), shared: false };
      },
      async set(chave, valor) {
        var r = await chamarAPI({
          acao: "salvar",
          senha: SESSAO.senha,
          rev: SESSAO.rev,
          dados: JSON.parse(valor),
        });
        if (!r.ok) {
          if (r.erro === "conflito") {
            alert(
              "Os dados foram alterados em outro dispositivo enquanto você usava o CRM.\n\n" +
              "A página será recarregada com a versão mais recente. Pode ser necessário refazer a última alteração."
            );
            location.reload();
          }
          throw new Error(r.erro || "falha ao salvar");
        }
        SESSAO.rev = r.rev;
        return { key: chave, value: valor, shared: false };
      },
      async delete(chave) { return { key: chave, deleted: true, shared: false }; },
      async list() { return { keys: [], shared: false }; },
    };
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    /* ==== CRM FloreSer — acompanhamento de leads com follow-up por categoria ==== */

    const CORES = {
      floresta: "#1E3A3A",
      verde: "#3B6E6A",
      ouro: "#8C7550",
      areia: "#F5F3EE",
      branco: "#FFFFFF",
      atrasado: "#A3543A",
    };

    const CATEGORIAS_INICIAIS = [
      { id: "c1", nome: "Quente", intervalo: 2 },
      { id: "c2", nome: "Morno", intervalo: 5 },
      { id: "c3", nome: "Frio", intervalo: 10 },
    ];

    const STORAGE_KEY = "crm-floreser-dados";

    function hojeISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function diasDesde(dataISO) {
      if (!dataISO) return null;
      const [y, m, d] = dataISO.split("-").map(Number);
      const data = new Date(y, m - 1, d);
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      return Math.floor((hoje - data) / 86400000);
    }

    function formatarData(dataISO) {
      if (!dataISO) return "—";
      const [y, m, d] = dataISO.split("-");
      return `${d}/${m}/${y}`;
    }

    function novoId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // status do lead em relação ao follow-up
    function statusLead(lead, categorias) {
      const cat = categorias.find((c) => c.id === lead.categoriaId);
      if (!cat) return { tipo: "sem-categoria", texto: "Sem categoria", dias: null };
      const dias = diasDesde(lead.ultimoContato);
      if (dias === null) return { tipo: "atrasado", texto: "Nunca contatado", dias: null, atraso: 999 };
      const restam = cat.intervalo - dias;
      if (restam < 0) return { tipo: "atrasado", texto: `Atrasado ${-restam} dia${-restam > 1 ? "s" : ""}`, dias, atraso: -restam };
      if (restam === 0) return { tipo: "hoje", texto: "Contatar hoje", dias, atraso: 0 };
      return { tipo: "em-dia", texto: `Próximo em ${restam} dia${restam > 1 ? "s" : ""}`, dias, atraso: -restam };
    }

    function CRMFloreSer() {
      const [carregando, setCarregando] = useState(true);
      const [erro, setErro] = useState(null);
      const [categorias, setCategorias] = useState(CATEGORIAS_INICIAIS);
      const [leads, setLeads] = useState([]);
      const [aba, setAba] = useState("hoje"); // hoje | leads | categorias
      const [filtroCategoria, setFiltroCategoria] = useState("todas");
      const [busca, setBusca] = useState("");
      const [editandoLead, setEditandoLead] = useState(null); // null | "novo" | lead
      const [leadAberto, setLeadAberto] = useState(null);
      const [importando, setImportando] = useState(false);

      // ---- carregar dados ----
      useEffect(() => {
        (async () => {
          try {
            const res = await window.storage.get(STORAGE_KEY);
            if (res && res.value) {
              const dados = JSON.parse(res.value);
              if (dados.categorias) setCategorias(dados.categorias);
              if (dados.leads) setLeads(dados.leads);
            }
          } catch (e) {
            // chave ainda não existe — primeiro uso
          } finally {
            setCarregando(false);
          }
        })();
      }, []);

      // ---- salvar dados ----
      async function salvar(novasCategorias, novosLeads) {
        const cats = novasCategorias ?? categorias;
        const lds = novosLeads ?? leads;
        if (novasCategorias) setCategorias(novasCategorias);
        if (novosLeads) setLeads(novosLeads);
        try {
          await window.storage.set(STORAGE_KEY, JSON.stringify({ categorias: cats, leads: lds }));
          setErro(null);
        } catch (e) {
          setErro("Não foi possível salvar. Tente novamente.");
        }
      }

      // ---- ações de lead ----
      function salvarLead(dados) {
        if (dados.id) {
          salvar(null, leads.map((l) => (l.id === dados.id ? { ...l, ...dados } : l)));
        } else {
          salvar(null, [...leads, { ...dados, id: novoId(), criadoEm: hojeISO() }]);
        }
        setEditandoLead(null);
      }

      function excluirLead(id) {
        salvar(null, leads.filter((l) => l.id !== id));
        setLeadAberto(null);
        setEditandoLead(null);
      }

      function registrarContato(id) {
        salvar(null, leads.map((l) => (l.id === id ? { ...l, ultimoContato: hojeISO() } : l)));
      }

      function importarLeads(novos) {
        salvar(null, [...leads, ...novos.map((n) => ({ ...n, id: novoId(), criadoEm: hojeISO() }))]);
        setImportando(false);
        setAba("leads");
      }

      // ---- ações de categoria ----
      function salvarCategoria(cat) {
        if (cat.id) {
          salvar(categorias.map((c) => (c.id === cat.id ? { ...c, ...cat } : c)), null);
        } else {
          salvar([...categorias, { ...cat, id: novoId() }], null);
        }
      }

      function excluirCategoria(id) {
        const temLeads = leads.some((l) => l.categoriaId === id);
        if (temLeads) {
          setErro("Esta categoria tem leads vinculados. Mova os leads antes de excluir.");
          return;
        }
        salvar(categorias.filter((c) => c.id !== id), null);
      }

      // ---- listas derivadas ----
      const leadsComStatus = useMemo(
        () => leads.map((l) => ({ ...l, status: statusLead(l, categorias) })),
        [leads, categorias]
      );

      const pendentes = leadsComStatus
        .filter((l) => l.status.tipo === "atrasado" || l.status.tipo === "hoje")
        .sort((a, b) => (b.status.atraso ?? 0) - (a.status.atraso ?? 0));

      const leadsFiltrados = leadsComStatus
        .filter((l) => filtroCategoria === "todas" || l.categoriaId === filtroCategoria)
        .filter((l) => l.nome.toLowerCase().includes(busca.toLowerCase()))
        .sort((a, b) => a.nome.localeCompare(b.nome));

      if (carregando) {
        return (
          <div style={{ minHeight: "100vh", background: CORES.areia, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Montserrat', sans-serif", color: CORES.verde }}>
            Carregando seus leads…
          </div>
        );
      }

      return (
        <div style={{ minHeight: "100vh", background: CORES.areia, fontFamily: "'Montserrat', -apple-system, sans-serif", color: CORES.floresta }}>
          <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        input, select, textarea, button { font-family: 'Montserrat', sans-serif; }
        input:focus, select:focus, textarea:focus { outline: 2px solid ${CORES.verde}; outline-offset: 1px; }
        button { cursor: pointer; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

          {/* ===== Cabeçalho ===== */}
          <header style={{ background: CORES.floresta, color: CORES.areia, padding: "28px 20px 20px" }}>
            <div style={{ maxWidth: 720, margin: "0 auto" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
                <div style={{ fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#C9BFA8" }}>
                  Clínica Corpo e Alma
                </div>
                <a href="index.html" style={{ marginLeft: "auto", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "#C9BFA8", textDecoration: "none" }}>
                  ‹ Início
                </a>
              </div>
              <h1 style={{ fontFamily: "'Cormorant Garamond', serif", fontWeight: 600, fontSize: 34, margin: 0, lineHeight: 1.1 }}>
                CRM Flore<span style={{ fontStyle: "italic", color: "#D8C9A5" }}>Ser</span>
              </h1>
              {/* abas */}
              <nav style={{ display: "flex", gap: 6, marginTop: 20 }}>
                {[
                  { id: "hoje", rotulo: `Follow-ups${pendentes.length ? ` (${pendentes.length})` : ""}` },
                  { id: "leads", rotulo: "Todos os leads" },
                  { id: "categorias", rotulo: "Categorias" },
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setAba(t.id)}
                    style={{
                      border: "none",
                      borderRadius: 20,
                      padding: "8px 16px",
                      fontSize: 13,
                      fontWeight: 600,
                      background: aba === t.id ? CORES.areia : "rgba(245,243,238,0.12)",
                      color: aba === t.id ? CORES.floresta : CORES.areia,
                      transition: "background 0.15s",
                    }}
                  >
                    {t.rotulo}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main style={{ maxWidth: 720, margin: "0 auto", padding: "20px 16px 80px" }}>
            {erro && (
              <div style={{ background: "#F3E2DC", color: CORES.atrasado, padding: "10px 14px", borderRadius: 8, fontSize: 13, marginBottom: 16 }}>
                {erro}
                <button onClick={() => setErro(null)} style={{ float: "right", border: "none", background: "none", color: CORES.atrasado, fontWeight: 700 }}>✕</button>
              </div>
            )}

            {/* ===== ABA: Follow-ups de hoje ===== */}
            {aba === "hoje" && (
              <section>
                <h2 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: "8px 0 4px" }}>
                  Quem precisa de você hoje
                </h2>
                <p style={{ fontSize: 13, color: CORES.verde, margin: "0 0 20px" }}>
                  Leads com follow-up vencido ou vencendo hoje, do mais atrasado para o mais recente.
                </p>
                {pendentes.length === 0 ? (
                  <div style={{ background: CORES.branco, borderRadius: 12, padding: "36px 20px", textAlign: "center", border: `1px solid #E5E0D5` }}>
                    <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 22, color: CORES.verde }}>Tudo em dia 🌿</div>
                    <div style={{ fontSize: 13, color: "#7A756A", marginTop: 6 }}>
                      Nenhum lead aguardando contato. Cadastre novos leads na aba "Todos os leads".
                    </div>
                  </div>
                ) : (
                  pendentes.map((l) => (
                    <CartaoLead
                      key={l.id}
                      lead={l}
                      categorias={categorias}
                      aoAbrir={() => setLeadAberto(l)}
                      aoContatar={() => registrarContato(l.id)}
                    />
                  ))
                )}
              </section>
            )}

            {/* ===== ABA: Todos os leads ===== */}
            {aba === "leads" && (
              <section>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "8px 0 16px" }}>
                  <input
                    placeholder="Buscar por nome…"
                    value={busca}
                    onChange={(e) => setBusca(e.target.value)}
                    style={{ flex: "1 1 160px", padding: "10px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 14, background: CORES.branco }}
                  />
                  <select
                    value={filtroCategoria}
                    onChange={(e) => setFiltroCategoria(e.target.value)}
                    style={{ padding: "10px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 14, background: CORES.branco }}
                  >
                    <option value="todas">Todas as categorias</option>
                    {categorias.map((c) => (
                      <option key={c.id} value={c.id}>{c.nome} — a cada {c.intervalo}d</option>
                    ))}
                  </select>
                  <button
                    onClick={() => setEditandoLead("novo")}
                    style={{ padding: "10px 18px", borderRadius: 8, border: "none", background: CORES.verde, color: CORES.branco, fontWeight: 600, fontSize: 14 }}
                  >
                    + Novo lead
                  </button>
                  <button
                    onClick={() => setImportando(true)}
                    style={{ padding: "10px 18px", borderRadius: 8, border: `1.5px solid ${CORES.ouro}`, background: "none", color: CORES.ouro, fontWeight: 600, fontSize: 14 }}
                  >
                    Importar planilha
                  </button>
                </div>

                {leadsFiltrados.length === 0 ? (
                  <div style={{ background: CORES.branco, borderRadius: 12, padding: "36px 20px", textAlign: "center", border: "1px solid #E5E0D5" }}>
                    <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 22, color: CORES.verde }}>Nenhum lead por aqui</div>
                    <div style={{ fontSize: 13, color: "#7A756A", marginTop: 6 }}>
                      Toque em "+ Novo lead" para cadastrar o primeiro.
                    </div>
                  </div>
                ) : (
                  leadsFiltrados.map((l) => (
                    <CartaoLead
                      key={l.id}
                      lead={l}
                      categorias={categorias}
                      aoAbrir={() => setLeadAberto(l)}
                      aoContatar={() => registrarContato(l.id)}
                    />
                  ))
                )}
              </section>
            )}

            {/* ===== ABA: Categorias ===== */}
            {aba === "categorias" && (
              <GerenciarCategorias
                categorias={categorias}
                leads={leads}
                aoSalvar={salvarCategoria}
                aoExcluir={excluirCategoria}
              />
            )}
          </main>

          {/* ===== Modal: detalhe do lead ===== */}
          {leadAberto && !editandoLead && (
            <Modal aoFechar={() => setLeadAberto(null)}>
              <DetalheLead
                lead={leadsComStatus.find((l) => l.id === leadAberto.id) || leadAberto}
                categorias={categorias}
                aoEditar={() => setEditandoLead(leadAberto)}
                aoContatar={() => registrarContato(leadAberto.id)}
                aoExcluir={() => excluirLead(leadAberto.id)}
              />
            </Modal>
          )}

          {/* ===== Modal: importar planilha ===== */}
          {importando && (
            <Modal aoFechar={() => setImportando(false)}>
              <ImportarPlanilha
                categorias={categorias}
                aoImportar={importarLeads}
                aoCancelar={() => setImportando(false)}
              />
            </Modal>
          )}

          {/* ===== Modal: cadastro/edição ===== */}
          {editandoLead && (
            <Modal aoFechar={() => setEditandoLead(null)}>
              <FormularioLead
                lead={editandoLead === "novo" ? null : editandoLead}
                categorias={categorias}
                aoSalvar={salvarLead}
                aoCancelar={() => setEditandoLead(null)}
              />
            </Modal>
          )}
        </div>
      );
    }

    /* ==== Cartão de lead na lista ==== */
    function CartaoLead({ lead, categorias, aoAbrir, aoContatar }) {
      const cat = categorias.find((c) => c.id === lead.categoriaId);
      const s = lead.status;
      const corStatus = s.tipo === "atrasado" ? CORES.atrasado : s.tipo === "hoje" ? CORES.ouro : CORES.verde;

      return (
        <div style={{ background: CORES.branco, borderRadius: 12, border: "1px solid #E5E0D5", padding: "14px 16px", marginBottom: 10, display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={aoAbrir} style={{ flex: 1, textAlign: "left", border: "none", background: "none", padding: 0 }}>
            <div style={{ fontWeight: 600, fontSize: 15, color: CORES.floresta }}>{lead.nome}</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 4, alignItems: "center" }}>
              {cat && (
                <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: CORES.verde, background: "#EAF0EE", padding: "2px 8px", borderRadius: 10 }}>
                  {cat.nome} · {cat.intervalo}d
                </span>
              )}
              <span style={{ fontSize: 12, fontWeight: 600, color: corStatus }}>{s.texto}</span>
              <span style={{ fontSize: 12, color: "#9A948A" }}>Último contato: {formatarData(lead.ultimoContato)}</span>
            </div>
          </button>
          <button
            onClick={aoContatar}
            title="Registrar contato feito hoje"
            style={{ border: `1.5px solid ${CORES.verde}`, background: "none", color: CORES.verde, borderRadius: 8, padding: "8px 12px", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }}
          >
            Contatei hoje ✓
          </button>
        </div>
      );
    }

    /* ==== Detalhe do lead ==== */
    function DetalheLead({ lead, categorias, aoEditar, aoContatar, aoExcluir }) {
      const [confirmando, setConfirmando] = useState(false);
      const cat = categorias.find((c) => c.id === lead.categoriaId);
      const telLimpo = (lead.whatsapp || "").replace(/\D/g, "");

      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 26, fontWeight: 600, margin: "0 0 2px" }}>{lead.nome}</h3>
          {cat && <div style={{ fontSize: 12, color: CORES.verde, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em" }}>{cat.nome} · follow-up a cada {cat.intervalo} dias</div>}

          <dl style={{ margin: "18px 0", fontSize: 14, lineHeight: 1.7 }}>
            <Linha rotulo="WhatsApp" valor={lead.whatsapp || "—"} />
            <Linha rotulo="Interesse" valor={lead.interesse || "—"} />
            <Linha rotulo="Último contato" valor={formatarData(lead.ultimoContato)} />
            <Linha rotulo="Status" valor={lead.status?.texto || "—"} />
            {lead.observacoes && (
              <div style={{ marginTop: 10 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: "#9A948A" }}>Observações</div>
                <div style={{ whiteSpace: "pre-wrap", marginTop: 4 }}>{lead.observacoes}</div>
              </div>
            )}
          </dl>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {telLimpo && (
              <a
                href={`https://wa.me/55${telLimpo}`}
                target="_blank"
                rel="noreferrer"
                style={{ background: CORES.verde, color: CORES.branco, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600, textDecoration: "none" }}
              >
                Abrir WhatsApp
              </a>
            )}
            <button onClick={aoContatar} style={{ border: `1.5px solid ${CORES.verde}`, background: "none", color: CORES.verde, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600 }}>
              Contatei hoje ✓
            </button>
            <button onClick={aoEditar} style={{ border: "1.5px solid #C9C2B2", background: "none", color: CORES.floresta, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600 }}>
              Editar
            </button>
            {!confirmando ? (
              <button onClick={() => setConfirmando(true)} style={{ border: "none", background: "none", color: CORES.atrasado, fontSize: 13, fontWeight: 600, marginLeft: "auto" }}>
                Excluir
              </button>
            ) : (
              <button onClick={aoExcluir} style={{ border: "none", background: CORES.atrasado, color: CORES.branco, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600, marginLeft: "auto" }}>
                Confirmar exclusão
              </button>
            )}
          </div>
        </div>
      );
    }

    function Linha({ rotulo, valor }) {
      return (
        <div style={{ display: "flex", gap: 12 }}>
          <dt style={{ width: 110, fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: "#9A948A", paddingTop: 3 }}>{rotulo}</dt>
          <dd style={{ margin: 0, flex: 1 }}>{valor}</dd>
        </div>
      );
    }

    /* ==== Formulário de lead ==== */
    function FormularioLead({ lead, categorias, aoSalvar, aoCancelar }) {
      const [dados, setDados] = useState({
        id: lead?.id,
        nome: lead?.nome || "",
        whatsapp: lead?.whatsapp || "",
        interesse: lead?.interesse || "",
        observacoes: lead?.observacoes || "",
        categoriaId: lead?.categoriaId || categorias[0]?.id || "",
        ultimoContato: lead?.ultimoContato || hojeISO(),
      });

      const podeSalvar = dados.nome.trim().length > 0 && dados.categoriaId;

      const campo = { display: "block", width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 14, background: CORES.branco, marginTop: 4 };
      const rotulo = { fontSize: 12, fontWeight: 600, color: CORES.floresta, display: "block", marginTop: 14 };

      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: 0 }}>
            {lead ? "Editar lead" : "Novo lead"}
          </h3>

          <label style={rotulo}>Nome *
            <input style={campo} value={dados.nome} onChange={(e) => setDados({ ...dados, nome: e.target.value })} placeholder="Nome da cliente" />
          </label>
          <label style={rotulo}>WhatsApp
            <input style={campo} value={dados.whatsapp} onChange={(e) => setDados({ ...dados, whatsapp: e.target.value })} placeholder="(65) 99999-9999" />
          </label>
          <label style={rotulo}>Interesse
            <input style={campo} value={dados.interesse} onChange={(e) => setDados({ ...dados, interesse: e.target.value })} placeholder="Ex.: Ultraformer, limpeza de pele…" />
          </label>
          <label style={rotulo}>Categoria *
            <select style={campo} value={dados.categoriaId} onChange={(e) => setDados({ ...dados, categoriaId: e.target.value })}>
              {categorias.map((c) => (
                <option key={c.id} value={c.id}>{c.nome} — contato a cada {c.intervalo} dias</option>
              ))}
            </select>
          </label>
          <label style={rotulo}>Data do último contato
            <input type="date" style={campo} value={dados.ultimoContato} onChange={(e) => setDados({ ...dados, ultimoContato: e.target.value })} />
          </label>
          <label style={rotulo}>Observações
            <textarea style={{ ...campo, minHeight: 80, resize: "vertical" }} value={dados.observacoes} onChange={(e) => setDados({ ...dados, observacoes: e.target.value })} placeholder="Como conheceu a clínica, preferências, histórico da conversa…" />
          </label>

          <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
            <button
              disabled={!podeSalvar}
              onClick={() => aoSalvar(dados)}
              style={{ background: podeSalvar ? CORES.verde : "#B9C7C3", color: CORES.branco, border: "none", borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600, cursor: podeSalvar ? "pointer" : "not-allowed" }}
            >
              Salvar lead
            </button>
            <button onClick={aoCancelar} style={{ background: "none", border: "1.5px solid #C9C2B2", color: CORES.floresta, borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600 }}>
              Cancelar
            </button>
          </div>
        </div>
      );
    }

    /* ==== Gestão de categorias ==== */
    function GerenciarCategorias({ categorias, leads, aoSalvar, aoExcluir }) {
      const [novo, setNovo] = useState({ nome: "", intervalo: "" });
      const [editando, setEditando] = useState(null);

      const contagem = (id) => leads.filter((l) => l.categoriaId === id).length;

      return (
        <section>
          <h2 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: "8px 0 4px" }}>
            Categorias de follow-up
          </h2>
          <p style={{ fontSize: 13, color: CORES.verde, margin: "0 0 20px" }}>
            Cada categoria define de quantos em quantos dias você entra em contato com o lead.
          </p>

          {categorias.map((c) => (
            <div key={c.id} style={{ background: CORES.branco, borderRadius: 12, border: "1px solid #E5E0D5", padding: "14px 16px", marginBottom: 10 }}>
              {editando === c.id ? (
                <EdicaoCategoria
                  inicial={c}
                  aoSalvar={(dados) => { aoSalvar({ ...dados, id: c.id }); setEditando(null); }}
                  aoCancelar={() => setEditando(null)}
                />
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                  <div style={{ flex: 1 }}>
                    <span style={{ fontWeight: 600, fontSize: 15 }}>{c.nome}</span>
                    <span style={{ fontSize: 13, color: CORES.verde, marginLeft: 10 }}>a cada {c.intervalo} dia{c.intervalo > 1 ? "s" : ""}</span>
                    <span style={{ fontSize: 12, color: "#9A948A", marginLeft: 10 }}>{contagem(c.id)} lead{contagem(c.id) !== 1 ? "s" : ""}</span>
                  </div>
                  <button onClick={() => setEditando(c.id)} style={{ border: "1.5px solid #C9C2B2", background: "none", borderRadius: 8, padding: "7px 12px", fontSize: 12, fontWeight: 600, color: CORES.floresta }}>Editar</button>
                  <button onClick={() => aoExcluir(c.id)} style={{ border: "none", background: "none", color: CORES.atrasado, fontSize: 12, fontWeight: 600 }}>Excluir</button>
                </div>
              )}
            </div>
          ))}

          <div style={{ background: "#EDEAE0", borderRadius: 12, padding: "14px 16px", marginTop: 16 }}>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.ouro, marginBottom: 8 }}>Nova categoria</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <input
                placeholder="Nome (ex.: Pós-avaliação)"
                value={novo.nome}
                onChange={(e) => setNovo({ ...novo, nome: e.target.value })}
                style={{ flex: "2 1 160px", padding: "10px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 14, background: CORES.branco }}
              />
              <input
                type="number"
                min="1"
                placeholder="Dias"
                value={novo.intervalo}
                onChange={(e) => setNovo({ ...novo, intervalo: e.target.value })}
                style={{ flex: "1 1 80px", padding: "10px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 14, background: CORES.branco }}
              />
              <button
                disabled={!novo.nome.trim() || !(Number(novo.intervalo) >= 1)}
                onClick={() => { aoSalvar({ nome: novo.nome.trim(), intervalo: Number(novo.intervalo) }); setNovo({ nome: "", intervalo: "" }); }}
                style={{ background: CORES.verde, color: CORES.branco, border: "none", borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600, opacity: !novo.nome.trim() || !(Number(novo.intervalo) >= 1) ? 0.5 : 1 }}
              >
                Adicionar
              </button>
            </div>
          </div>
        </section>
      );
    }

    function EdicaoCategoria({ inicial, aoSalvar, aoCancelar }) {
      const [dados, setDados] = useState({ nome: inicial.nome, intervalo: String(inicial.intervalo) });
      const valido = dados.nome.trim() && Number(dados.intervalo) >= 1;
      return (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input value={dados.nome} onChange={(e) => setDados({ ...dados, nome: e.target.value })} style={{ flex: "2 1 140px", padding: "9px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 14 }} />
          <input type="number" min="1" value={dados.intervalo} onChange={(e) => setDados({ ...dados, intervalo: e.target.value })} style={{ flex: "1 1 70px", padding: "9px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 14 }} />
          <button disabled={!valido} onClick={() => aoSalvar({ nome: dados.nome.trim(), intervalo: Number(dados.intervalo) })} style={{ background: CORES.verde, color: "#fff", border: "none", borderRadius: 8, padding: "9px 14px", fontSize: 13, fontWeight: 600, opacity: valido ? 1 : 0.5 }}>Salvar</button>
          <button onClick={aoCancelar} style={{ background: "none", border: "1.5px solid #C9C2B2", borderRadius: 8, padding: "9px 14px", fontSize: 13, fontWeight: 600, color: CORES.floresta }}>Cancelar</button>
        </div>
      );
    }

    /* ==== Importar planilha (Excel ou CSV) ==== */
    function normalizarData(valor) {
      if (!valor && valor !== 0) return "";
      if (valor instanceof Date && !isNaN(valor)) {
        return `${valor.getFullYear()}-${String(valor.getMonth() + 1).padStart(2, "0")}-${String(valor.getDate()).padStart(2, "0")}`;
      }
      const s = String(valor).trim();
      let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); // yyyy-mm-dd
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); // dd/mm/aaaa
      if (m) {
        const ano = m[3].length === 2 ? `20${m[3]}` : m[3];
        return `${ano}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      }
      return "";
    }

    function ImportarPlanilha({ categorias, aoImportar, aoCancelar }) {
      const [linhas, setLinhas] = useState(null);
      const [colunas, setColunas] = useState([]);
      const [mapa, setMapa] = useState({ nome: "", whatsapp: "", interesse: "", observacoes: "", categoria: "", ultimoContato: "" });
      const [categoriaPadrao, setCategoriaPadrao] = useState(categorias[0]?.id || "");
      const [erroArq, setErroArq] = useState(null);

      async function lerArquivo(e) {
        const arquivo = e.target.files?.[0];
        if (!arquivo) return;
        setErroArq(null);
        try {
          const buf = await arquivo.arrayBuffer();
          const wb = XLSX.read(buf, { cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const dados = XLSX.utils.sheet_to_json(ws, { defval: "" });
          if (!dados.length) { setErroArq("A planilha está vazia ou sem cabeçalhos na primeira linha."); return; }
          const cabecalhos = Object.keys(dados[0]);
          const achar = (...termos) => cabecalhos.find((h) => termos.some((t) => h.toLowerCase().includes(t))) || "";
          setColunas(cabecalhos);
          setLinhas(dados);
          setMapa({
            nome: achar("nome", "name", "cliente", "lead"),
            whatsapp: achar("whats", "telefone", "celular", "fone", "phone"),
            interesse: achar("interesse", "tratamento", "procedimento"),
            observacoes: achar("obs", "nota", "coment"),
            categoria: achar("categoria", "tipo", "status"),
            ultimoContato: achar("contato", "data"),
          });
        } catch {
          setErroArq("Não consegui ler este arquivo. Use .xlsx, .xls ou .csv.");
        }
      }

      const validos = useMemo(() => {
        if (!linhas || !mapa.nome) return [];
        return linhas
          .map((r) => {
            const nome = String(r[mapa.nome] ?? "").trim();
            if (!nome) return null;
            const nomeCat = mapa.categoria ? String(r[mapa.categoria] ?? "").trim().toLowerCase() : "";
            const cat = categorias.find((c) => c.nome.toLowerCase() === nomeCat);
            return {
              nome,
              whatsapp: mapa.whatsapp ? String(r[mapa.whatsapp] ?? "").trim() : "",
              interesse: mapa.interesse ? String(r[mapa.interesse] ?? "").trim() : "",
              observacoes: mapa.observacoes ? String(r[mapa.observacoes] ?? "").trim() : "",
              categoriaId: cat ? cat.id : categoriaPadrao,
              ultimoContato: (mapa.ultimoContato && normalizarData(r[mapa.ultimoContato])) || hojeISO(),
            };
          })
          .filter(Boolean);
      }, [linhas, mapa, categoriaPadrao, categorias]);

      const semCategoriaPropria = validos.filter((v) => v.categoriaId === categoriaPadrao).length;
      const campo = { display: "block", width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 13, background: CORES.branco, marginTop: 4 };
      const rotulo = { fontSize: 12, fontWeight: 600, color: CORES.floresta, display: "block", marginTop: 12 };

      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: 0 }}>Importar planilha</h3>
          <p style={{ fontSize: 13, color: CORES.verde, margin: "6px 0 14px" }}>
            A primeira linha da planilha deve ter os títulos das colunas (ex.: Nome, WhatsApp, Categoria…).
          </p>

          <input type="file" accept=".xlsx,.xls,.csv" onChange={lerArquivo} style={{ fontSize: 13 }} />
          {erroArq && <div style={{ color: CORES.atrasado, fontSize: 13, marginTop: 8 }}>{erroArq}</div>}

          {linhas && (
            <>
              <div style={{ background: "#EDEAE0", borderRadius: 10, padding: "12px 14px", marginTop: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.ouro }}>
                  Combine as colunas da sua planilha
                </div>
                {[
                  ["nome", "Nome *"],
                  ["whatsapp", "WhatsApp"],
                  ["interesse", "Interesse"],
                  ["observacoes", "Observações"],
                  ["categoria", "Categoria"],
                  ["ultimoContato", "Data do último contato"],
                ].map(([chave, texto]) => (
                  <label key={chave} style={rotulo}>{texto}
                    <select style={campo} value={mapa[chave]} onChange={(e) => setMapa({ ...mapa, [chave]: e.target.value })}>
                      <option value="">— não importar —</option>
                      {colunas.map((c) => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </label>
                ))}
                <label style={rotulo}>Categoria padrão (quando a linha não tiver uma categoria reconhecida)
                  <select style={campo} value={categoriaPadrao} onChange={(e) => setCategoriaPadrao(e.target.value)}>
                    {categorias.map((c) => <option key={c.id} value={c.id}>{c.nome} — a cada {c.intervalo} dias</option>)}
                  </select>
                </label>
              </div>

              <div style={{ fontSize: 13, color: CORES.floresta, marginTop: 14 }}>
                {mapa.nome
                  ? <>Prontos para importar: <strong>{validos.length}</strong> lead{validos.length !== 1 ? "s" : ""}{mapa.categoria && semCategoriaPropria > 0 && <> ({semCategoriaPropria} irão para a categoria padrão)</>}. Linhas sem nome são ignoradas. Leads sem data de contato entram com a data de hoje.</>
                  : "Escolha qual coluna contém o nome do lead para continuar."}
              </div>

              <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                <button
                  disabled={!validos.length}
                  onClick={() => aoImportar(validos)}
                  style={{ background: validos.length ? CORES.verde : "#B9C7C3", color: CORES.branco, border: "none", borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600, cursor: validos.length ? "pointer" : "not-allowed" }}
                >
                  Importar {validos.length > 0 ? validos.length : ""} lead{validos.length !== 1 ? "s" : ""}
                </button>
                <button onClick={aoCancelar} style={{ background: "none", border: "1.5px solid #C9C2B2", color: CORES.floresta, borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600 }}>
                  Cancelar
                </button>
              </div>
            </>
          )}
        </div>
      );
    }

    /* ==== Modal genérico ==== */
    function Modal({ children, aoFechar }) {
      return (
        <div
          onClick={aoFechar}
          style={{ position: "fixed", inset: 0, background: "rgba(30,58,58,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50, padding: 12 }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ background: CORES.areia, borderRadius: 16, padding: "22px 20px 26px", width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", boxShadow: "0 12px 40px rgba(30,58,58,0.3)" }}
          >
            <button onClick={aoFechar} aria-label="Fechar" style={{ float: "right", border: "none", background: "none", fontSize: 18, color: CORES.verde, marginTop: -6 }}>✕</button>
            {children}
          </div>
        </div>
      );
    }

    /* ==== Tela de entrada com senha ==== */
    function Portao() {
      const [senha, setSenha] = useState("");
      const [estado, setEstado] = useState("form"); // form | verificando | ok
      const [erro, setErro] = useState("");

      async function entrar() {
        if (!senha.trim()) return;
        setEstado("verificando");
        setErro("");
        SESSAO.senha = senha;
        try {
          const r = await chamarAPI({ acao: "ler", senha: senha });
          if (r.ok) {
            SESSAO.rev = r.rev;
            setEstado("ok");
          } else if (r.erro === "senha") {
            setErro("Senha incorreta.");
            setEstado("form");
          } else {
            setErro("Não foi possível conectar à planilha. Verifique a publicação do Apps Script.");
            setEstado("form");
          }
        } catch (e) {
          setErro("Sem conexão com a planilha. Confira a URL do Apps Script e sua internet.");
          setEstado("form");
        }
      }

      if (estado === "ok") return <CRMFloreSer />;

      return (
        <div style={{ minHeight: "100vh", background: "#1E3A3A", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: "'Montserrat', sans-serif" }}>
          <style>{`@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&display=swap');`}</style>
          <div style={{ background: "#F5F3EE", borderRadius: 16, padding: "34px 28px", width: "100%", maxWidth: 380, textAlign: "center" }}>
            <div style={{ fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "#8C7550", marginBottom: 6 }}>
              Clínica Corpo e Alma
            </div>
            <h1 style={{ fontFamily: "'Cormorant Garamond', serif", fontWeight: 600, fontSize: 32, margin: "0 0 22px", color: "#1E3A3A" }}>
              CRM Flore<span style={{ fontStyle: "italic", color: "#8C7550" }}>Ser</span>
            </h1>
            <input
              type="password"
              value={senha}
              onChange={(e) => setSenha(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") entrar(); }}
              placeholder="Senha de acesso"
              disabled={estado === "verificando"}
              style={{ width: "100%", padding: "12px 14px", borderRadius: 8, border: "1px solid #D8D2C4", fontSize: 15, textAlign: "center", fontFamily: "'Montserrat', sans-serif" }}
            />
            {erro && <div style={{ color: "#A3543A", fontSize: 13, marginTop: 10 }}>{erro}</div>}
            <button
              onClick={entrar}
              disabled={estado === "verificando" || !senha.trim()}
              style={{ width: "100%", marginTop: 14, padding: "12px", borderRadius: 8, border: "none", background: "#3B6E6A", color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer", opacity: estado === "verificando" || !senha.trim() ? 0.6 : 1, fontFamily: "'Montserrat', sans-serif" }}
            >
              {estado === "verificando" ? "Conectando…" : "Entrar"}
            </button>
          </div>
          <a href="index.html" style={{ marginTop: 18, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "#C9BFA8", textDecoration: "none" }}>
            ‹ Início
          </a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Portao />);
  </script>
</body>

</html>
